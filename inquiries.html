<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>問い合わせ管理</title>
<style>:root{font-family:Inter,"Noto Sans JP",system-ui,sans-serif;color:#172337;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}h1{margin:0;color:#0f2a4a;font-size:27px}header p{margin:7px 0 0;color:#66748a;font-size:13px}.login{display:flex;gap:8px}.login input{padding:10px 12px;border:1px solid #cbd4df;border-radius:7px}.btn{border:0;border-radius:7px;background:#0b63ce;color:#fff;padding:10px 16px;font-weight:700;cursor:pointer}.status{color:#b42318;min-height:22px}.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.filters button{border:1px solid #cbd4df;background:#fff;border-radius:99px;padding:7px 13px;cursor:pointer}.filters button.on{background:#0f2a4a;color:#fff;border-color:#0f2a4a}.list{display:grid;gap:12px}.item{background:#fff;border:1px solid #dfe5ec;border-radius:10px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:18px}.item h2{font-size:17px;margin:0 0 6px;color:#0f2a4a}.meta{font-size:12px;color:#6a778c;margin-bottom:10px}.details{font-size:14px;line-height:1.8}.details b{display:inline-block;min-width:90px;color:#506077}.ops{display:grid;gap:8px;min-width:180px}.ops select,.ops textarea{border:1px solid #cbd4df;border-radius:6px;padding:8px;font:inherit}.ops textarea{height:76px;resize:vertical}.ops button{border:0;border-radius:6px;padding:8px;background:#14834f;color:#fff;font-weight:700;cursor:pointer}.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#e8f1fc;color:#0b63ce}.empty{text-align:center;padding:50px;color:#778499;background:#fff;border-radius:10px}@media(max-width:700px){header{flex-direction:column;align-items:stretch}.item{grid-template-columns:1fr}.ops{min-width:0}}</style></head>
<body><div class="wrap"><header><div><h1>問い合わせ管理</h1><p>Supabaseに保存された企業・AI提供会社からのお申し込み</p></div><div class="login"><input id="password" type="password" placeholder="管理パスワード"><button class="btn" id="load">表示</button></div></header><p class="status" id="status"></p><div class="filters" id="filters"><button class="on" data-status="all">すべて</button><button data-status="new">未対応</button><button data-status="in_progress">対応中</button><button data-status="done">完了</button><button data-status="spam">迷惑</button></div><main class="list" id="list"><div class="empty">管理パスワードを入力してください</div></main></div>
<script>const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[],filter='all';const labels={new:'未対応',in_progress:'対応中',done:'完了',spam:'迷惑'};function password(){return $('password').value||sessionStorage.getItem('rai-admin-password')||''}function render(){const visible=filter==='all'?rows:rows.filter(x=>x.status===filter);$('list').innerHTML=visible.length?visible.map(x=>`<article class="item" data-id="${esc(x.id)}"><div><h2>${esc(x.company_name||x.contact_name||'名称未設定')} <span class="badge">${x.kind==='company'?'企業':'AI提供会社'}</span></h2><div class="meta">${esc(new Date(x.created_at).toLocaleString('ja-JP'))}・${esc(labels[x.status])}</div><div class="details"><div><b>担当者</b>${esc(x.contact_name||'—')}</div><div><b>メール</b><a href="mailto:${esc(x.email)}">${esc(x.email)}</a></div><div><b>相談内容</b>${esc(x.category||x.agent_specialty||'—')}</div></div></div><div class="ops"><select>${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${x.status===v?'selected':''}>${l}</option>`).join('')}</select><textarea placeholder="管理メモ">${esc(x.admin_notes)}</textarea><button>保存</button></div></article>`).join(''):'<div class="empty">該当する問い合わせはありません</div>';document.querySelectorAll('.item .ops button').forEach(btn=>btn.onclick=save)}async function load(){const p=password();if(!p){$('status').textContent='管理パスワードを入力してください。';return}$('status').textContent='読み込み中…';const r=await fetch('/api/inquiries',{headers:{'x-admin-password':p}});if(!r.ok){$('status').textContent=r.status===401?'パスワードが違います。':'取得できませんでした。';return}sessionStorage.setItem('rai-admin-password',p);$('password').value=p;rows=(await r.json()).inquiries;$('status').textContent='';render()}async function save(e){const item=e.target.closest('.item'),id=item.dataset.id,select=item.querySelector('select'),textarea=item.querySelector('textarea');e.target.disabled=true;const r=await fetch('/api/inquiries',{method:'PATCH',headers:{'content-type':'application/json','x-admin-password':password()},body:JSON.stringify({id,status:select.value,adminNotes:textarea.value})});e.target.disabled=false;if(!r.ok){$('status').textContent='保存できませんでした。';return}const updated=(await r.json()).inquiry;rows=rows.map(x=>x.id===id?updated:x);$('status').textContent='保存しました。';render()}$('load').onclick=load;$('password').onkeydown=e=>{if(e.key==='Enter')load()};$('filters').onclick=e=>{if(!e.target.dataset.status)return;filter=e.target.dataset.status;document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('on',b===e.target));render()};</script></body></html>
