<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>アクセス推定ダッシュボード</title>
<style>
:root{font-family:Inter,"Noto Sans JP",system-ui,sans-serif;color:#172337;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}h1{margin:0;color:#0f2a4a;font-size:27px}header p{margin:7px 0 0;color:#627086;font-size:13px}.login{display:flex;gap:8px}.login input{width:220px;padding:10px 12px;border:1px solid #cad3df;border-radius:7px}.login button,.refresh{border:0;border-radius:7px;background:#0b63ce;color:#fff;padding:10px 16px;font-weight:700;cursor:pointer}.status{min-height:22px;margin:0 0 14px;color:#b42318}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card{background:#fff;border:1px solid #dfe5ec;border-radius:10px;padding:18px}.card small{display:block;color:#6b778c}.card strong{display:block;font-size:30px;margin-top:4px;color:#0f2a4a}.card.ai strong{color:#c7352b}.card.warn strong{color:#ad6500}.panel{background:#fff;border:1px solid #dfe5ec;border-radius:10px;overflow:hidden}.panel-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #e5e9ef}.panel-h h2{font-size:16px;margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #edf0f4;vertical-align:top}th{background:#f8fafc;white-space:nowrap;color:#526073}td.ua{max-width:320px;word-break:break-word}.score{display:inline-flex;min-width:44px;justify-content:center;padding:4px 8px;border-radius:99px;font-weight:800;background:#e8f1fc;color:#0b63ce}.score.mid{background:#fff0d5;color:#995b00}.score.high{background:#fde8e7;color:#bd2d24}.reasons{color:#68758a;font-size:12px;max-width:270px}.empty{text-align:center;padding:44px;color:#778499}@media(max-width:780px){header{align-items:stretch;flex-direction:column}.login input{width:100%}.cards{grid-template-columns:repeat(2,1fr)}th,td{padding:10px}}
</style>
</head>
<body><div class="wrap">
<header><div><h1>アクセス推定ダッシュボード</h1><p>アクセスの特徴からAI・Botらしさを推定します。判定は確定情報ではありません。</p></div><div class="login"><input id="password" type="password" placeholder="管理パスワード" autocomplete="current-password"><button id="login">表示</button></div></header>
<p class="status" id="status"></p>
<div class="cards"><div class="card"><small>記録セッション</small><strong id="total">—</strong></div><div class="card"><small>人間の可能性が高い</small><strong id="human">—</strong></div><div class="card warn"><small>自動アクセスの疑い</small><strong id="suspicious">—</strong></div><div class="card ai"><small>AI・Botの可能性が高い</small><strong id="ai">—</strong></div></div>
<section class="panel"><div class="panel-h"><h2>最近のアクセス</h2><button class="refresh" id="refresh">更新</button></div><div class="table-wrap"><table><thead><tr><th>日時</th><th>判定</th><th>点数</th><th>行動</th><th>判定根拠</th><th>User-Agent</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">パスワードを入力してください</td></tr></tbody></table></div></section>
</div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function behaviorText(b){if(!b)return 'JS行動記録なし';return `${Math.round(b.duration)}秒・スクロール${Math.round(b.scrollDepth)}%・移動${b.mouseMoves}・クリック${b.clicks}`}
async function load(){const password=$('password').value||sessionStorage.getItem('rai-admin-password')||'';if(!password){$('status').textContent='管理パスワードを入力してください。';return}$('status').textContent='読み込み中…';try{const response=await fetch('/api/analytics',{headers:{'x-admin-password':password}});if(!response.ok)throw new Error(response.status===401?'パスワードが違います。':'データを取得できません。');const data=await response.json();sessionStorage.setItem('rai-admin-password',password);$('password').value=password;$('total').textContent=data.summary.total;$('human').textContent=data.summary.likelyHuman;$('suspicious').textContent=data.summary.suspicious;$('ai').textContent=data.summary.likelyAi;$('rows').innerHTML=data.sessions.length?data.sessions.map(row=>{const level=row.score>=65?'high':row.score>=35?'mid':'';return `<tr><td>${esc(new Date(row.lastSeen).toLocaleString('ja-JP'))}</td><td>${esc(row.classification)}</td><td><span class="score ${level}">${row.score}</span></td><td>${esc(behaviorText(row.behavior))}</td><td class="reasons">${esc(row.reasons.join('／')||'目立った自動化特徴なし')}</td><td class="ua">${esc(row.userAgent)}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">まだアクセス記録がありません</td></tr>';$('status').textContent='';}catch(error){$('status').textContent=error.message}}
$('login').onclick=load;$('refresh').onclick=load;$('password').onkeydown=e=>{if(e.key==='Enter')load()};
</script></body></html>
